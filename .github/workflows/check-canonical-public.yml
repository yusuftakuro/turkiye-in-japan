name: Check public-safe SSOT v1.1 proposal
on:
  push:
    paths:
      - 'data/canonical/v1.1-proposed/**'
      - 'scripts/check_canonical_public.py'
      - '.github/workflows/check-canonical-public.yml'
  pull_request:
    paths:
      - 'data/canonical/v1.1-proposed/**'
      - 'scripts/check_canonical_public.py'
      - '.github/workflows/check-canonical-public.yml'
jobs:
  check-public-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_canonical_public.py
